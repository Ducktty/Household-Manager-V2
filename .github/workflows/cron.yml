name: VAPID 推送 cron

on:
  schedule:
    - cron: "*/5 * * * *"  # 每 5 分钟
  workflow_dispatch:  # 允许手动触发

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Vercel cron endpoint
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://household-manager-v2.vercel.app/api/cron" \
            -w "\nHTTP %{http_code}\n"
